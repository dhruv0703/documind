services:
  - type: web
    runtime: docker
    name: documind-backend
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: documind-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: documind-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_AI_CHAT_ENABLED
        value: "false"
      - key: APP_AI_EMBEDDINGS_ENABLED
        value: "false"
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /tmp/uploads
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173

  - type: web
    runtime: static
    name: documind-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://documind-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: documind-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: documind
    ipAllowList: []
