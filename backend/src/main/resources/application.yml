spring:
  application:
    name: DocuMind RAG API
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/documind}
    username: ${DB_USERNAME:documind}
    password: ${DB_PASSWORD:documind}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    openai:
      api-key: ${OPENAI_COMPAT_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      chat:
        base-url: ${OPENAI_COMPAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        completions-path: ${OPENAI_COMPAT_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${OPENAI_COMPAT_CHAT_MODEL:${OPENAI_CHAT_MODEL:gemini-3.5-flash}}
      embedding:
        base-url: ${OPENAI_COMPAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        embeddings-path: ${OPENAI_COMPAT_EMBEDDINGS_PATH:/embeddings}
        options:
          model: ${OPENAI_COMPAT_EMBEDDING_MODEL:${OPENAI_EMBEDDING_MODEL:gemini-embedding-001}}
          dimensions: ${RAG_EMBEDDING_DIMENSION:1536}

server:
  port: ${SERVER_PORT:${PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    chat:
      enabled: ${APP_AI_CHAT_ENABLED:true}
    embeddings:
      enabled: ${APP_AI_EMBEDDINGS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:documind-local-jwt-secret-documind-local-jwt-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:uploads}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3:
      bucket: ${AWS_S3_BUCKET:}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:1200}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:200}
    embedding-dimension: ${RAG_EMBEDDING_DIMENSION:1536}
  upload:
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
  rate-limit:
    auth-requests-per-minute: ${APP_RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}
    upload-requests-per-minute: ${APP_RATE_LIMIT_UPLOAD_REQUESTS_PER_MINUTE:12}
